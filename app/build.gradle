plugins {
    id 'com.android.application'
}

android {
    namespace 'co.carryai.chromeclone'
    compileSdk 35

    defaultConfig {
        applicationId "co.carryai.chromeclone"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("/home/jetsonnano/chromeclone/chromeclone.keystore")
            storePassword "chromeclone123"
            keyAlias "chromeclone"
            keyPassword "chromeclone123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

configurations.all {
    // Force a single modern kotlin-stdlib so old jdk7/jdk8 split jars
    // (pulled transitively by appcompat) don't duplicate classes.
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WebViewCompat.addDocumentStartJavaScript for pre-parse bridge injection.
    implementation 'androidx.webkit:webkit:1.12.1'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (the Android stub throws "not mocked").
    testImplementation 'org.json:json:20231013'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}
