plugins {
    id 'com.android.application'
}

android {
    namespace 'co.carryai.chromeclone'
    compileSdk 35

    defaultConfig {
        applicationId "co.carryai.chromeclone"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // Keystore lives next to app/build.gradle so the build works on any
            // machine. It used to point at a hard-coded /home/jetsonnano path
            // that only existed on the original dev box. The keystore is
            // gitignored (*.keystore) — generate it once per checkout with:
            //   keytool -genkeypair -keystore app/chromeclone.keystore \
            //     -alias chromeclone -keyalg RSA -keysize 2048 -validity 10000 \
            //     -storepass chromeclone123 -keypass chromeclone123 \
            //     -dname "CN=ChromeClone, OU=CarryAI, O=CarryAI, L=HK, S=HK, C=HK"
            //
            // SECURITY: passwords are read from local.properties (gitignored),
            // never committed to source control. Add these lines to
            // local.properties (or supply via -P on the command line):
            //   CHROMECLONE_STORE_PASSWORD=chromeclone123
            //   CHROMECLONE_KEY_PASSWORD=chromeclone123
            storeFile file("chromeclone.keystore")
            storePassword project.findProperty('CHROMECLONE_STORE_PASSWORD') ?: ''
            keyAlias "chromeclone"
            keyPassword project.findProperty('CHROMECLONE_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

configurations.all {
    // Force a single modern kotlin-stdlib so old jdk7/jdk8 split jars
    // (pulled transitively by appcompat) don't duplicate classes.
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // WebViewCompat.addDocumentStartJavaScript for pre-parse bridge injection.
    implementation 'androidx.webkit:webkit:1.12.1'
    // WebSocket client for the native frame uploader (/ws/inference).
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // CameraX — native camera capture source (Phase 2).
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.lifecycle:lifecycle-common:2.8.3"
    implementation "androidx.lifecycle:lifecycle-runtime:2.8.3"

    testImplementation 'junit:junit:4.13.2'
    // Real org.json for JVM unit tests (the Android stub throws "not mocked").
    testImplementation 'org.json:json:20231013'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}

// Convenience: also drop the signed release APK at the repo root (gitignored)
// so install paths stay short and stable across machines. Plain doLast (not a
// Copy task) so Gradle doesn't treat the root project dir as a declared output
// and clash with lint's implicit project-dir dependency.
tasks.register('copyReleaseApk') {
    dependsOn 'assembleRelease'
    doLast {
        def src = layout.buildDirectory.file('outputs/apk/release/app-release.apk').get().asFile
        def dst = new File(rootProject.projectDir, 'app-release.apk')
        java.nio.file.Files.copy(src.toPath(), dst.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Copied ${src} -> ${dst}")
    }
}
tasks.matching { it.name == 'assembleRelease' }.configureEach {
    finalizedBy 'copyReleaseApk'
}
