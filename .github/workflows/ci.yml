name: Android CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Debug variant only, deliberately. `./gradlew build` runs
    # validateSigningRelease, which needs app/chromeclone.keystore — that file
    # is gitignored and generated per-checkout, so it never exists on a runner.
    # Debug also stays correct once the release keystore credentials move into
    # local.properties (PR #1), which CI likewise will not have.
    - name: Assemble debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Run lint
      run: ./gradlew lintDebug --no-daemon

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

    - name: Upload lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html
        if-no-files-found: ignore
